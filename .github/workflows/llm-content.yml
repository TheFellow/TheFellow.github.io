name: LLM content

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      - run: uv run --locked scripts/generate_llm_content.py
      - name: Check generated Markdown is current
        run: test -z "$(git status --porcelain)"
