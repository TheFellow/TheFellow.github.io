name: LLM content

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: ruby scripts/generate_llm_content.rb
      - name: Check generated Markdown is current
        run: test -z "$(git status --porcelain)"
