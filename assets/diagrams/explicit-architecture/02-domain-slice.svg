<title id="title">A domain is a vertical slice</title><desc id="desc">Directory proximity keeps a capability findable; import rules keep its responsibilities separate.. Original Mixology diagram by Ryan Harris, inspired by Herberto Graça’s Explicit Architecture. Source baseline a7c2efda8c0cd905089a27060242ff841bb0ad41. Linked panels open implementation evidence.</desc>
