<text x="40.0" y="88.0" font-size="34" text-anchor="start" font-weight="700">A domain is a vertical slice</text>
<text x="40.0" y="122.0" font-size="18" text-anchor="start" class="muted">Directory proximity keeps a capability findable; import rules keep its responsibilities separate.</text>
<rect x="40" y="165" width="950" height="626" rx="14" fill="#242021" stroke="#797482" stroke-width="1.5"/>
