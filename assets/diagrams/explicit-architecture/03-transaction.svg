<text x="75.0" y="268.0" font-size="21" text-anchor="start" font-weight="700">1 · Load + authorize</text>
<text x="75.0" y="298.0" font-size="17" text-anchor="start" class="muted">Trusted current input</text>
<text x="75.0" y="325.0" font-size="17" text-anchor="start" class="muted">Policy inside transaction</text>
</a>
