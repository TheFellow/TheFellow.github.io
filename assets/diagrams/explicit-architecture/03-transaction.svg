<text x="505.0" y="465.0" font-size="17" text-anchor="start" class="muted">Calculate from pre-reaction state</text>
<text x="505.0" y="492.0" font-size="17" text-anchor="start" class="muted">Menus projects stock + recipe changes</text>
</a>
