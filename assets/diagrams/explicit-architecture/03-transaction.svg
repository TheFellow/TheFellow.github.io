<text x="40.0" y="88.0" font-size="34" text-anchor="start" font-weight="700">One command, one local commit</text>
<text x="40.0" y="122.0" font-size="18" text-anchor="start" class="muted">Dashed numbered arrows describe execution. The preparation barrier applies separately to each event.</text>
