<title id="title">One command, one local commit</title><desc id="desc">Dashed numbered arrows describe execution. The preparation barrier applies separately to each event.. Original Mixology diagram by Ryan Harris, inspired by Herberto Graça’s Explicit Architecture. Source baseline a7c2efda8c0cd905089a27060242ff841bb0ad41. Linked panels open implementation evidence.</desc>
