<text x="960.0" y="435.0" font-size="21" text-anchor="start" font-weight="700">Apply leaf reactions in the same transaction</text>
<text x="960.0" y="465.0" font-size="17" text-anchor="start" class="muted">Drinks · Inventory · Menus · Orders</text>
<text x="960.0" y="492.0" font-size="17" text-anchor="start" class="muted">HandlerContext has no AddEvent</text>
</a>
<a href="https://github.com/TheFellow/go-modular-monolith/blob/a7c2efda8c0cd905089a27060242ff841bb0ad41/pkg/middleware/workflow.go" xlink:href="https://github.com/TheFellow/go-modular-monolith/blob/a7c2efda8c0cd905089a27060242ff841bb0ad41/pkg/middleware/workflow.go" target="_blank">
<rect x="40" y="620" width="685" height="140" rx="14" fill="#242021" stroke="#797482" stroke-width="1.5"/>
<text x="60.0" y="653.0" font-size="21" text-anchor="start" font-weight="700">Failure when this operation owns the transaction</text>
<text x="60.0" y="683.0" font-size="17" text-anchor="start" class="muted">Roll back domain changes and success activities.</text>
<text x="60.0" y="710.0" font-size="17" text-anchor="start" class="muted">Record the failed attempt separately after rollback.</text>
<text x="60.0" y="737.0" font-size="17" text-anchor="start" class="muted">Workflow owner correlates attempted effects across child commands.</text>
</a>
<a href="https://github.com/TheFellow/go-modular-monolith/blob/a7c2efda8c0cd905089a27060242ff841bb0ad41/app/cross_domain_regression_test.go" xlink:href="https://github.com/TheFellow/go-modular-monolith/blob/a7c2efda8c0cd905089a27060242ff841bb0ad41/app/cross_domain_regression_test.go" target="_blank">
<rect x="755" y="620" width="705" height="140" rx="14" fill="#242021" stroke="#797482" stroke-width="1.5"/>
<text x="775.0" y="653.0" font-size="21" text-anchor="start" font-weight="700">Ownership and cost</text>
<text x="775.0" y="683.0" font-size="17" text-anchor="start" class="muted">Caller-supplied transaction → caller owns completion and failure audit.</text>
<text x="775.0" y="710.0" font-size="17" text-anchor="start" class="muted">One slow or failing reaction affects the originating command.</text>
<text x="775.0" y="737.0" font-size="17" text-anchor="start" class="muted">Per-event preparation is a protocol tested with handler permutations.</text>
</a>
