<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
  <title id="title">Weave compiler adapter process contract</title>
  <desc id="desc">The Weave core negotiates capabilities with an isolated adapter, sends repository context, permissions, and limits, receives complete unit frames from a compiler-native runtime, and stages and validates the response before graph publication.</desc>
  <defs>
    <marker id="adapter-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4dabf7"/>
    </marker>
    <marker id="adapter-arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b197fc"/>
    </marker>
    <style>
      .title { fill: #f1f3f5; font: 700 36px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .lane { fill: #ced4da; font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1px; }
      .label { fill: #f1f3f5; font: 600 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #ced4da; font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tiny { fill: #adb5bd; font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .box { fill: #242021; stroke-width: 4; rx: 18; }
      .line-blue { fill: none; stroke: #4dabf7; stroke-width: 4; marker-end: url(#adapter-arrow-blue); }
      .line-purple { fill: none; stroke: #b197fc; stroke-width: 4; marker-end: url(#adapter-arrow-purple); }
      .divider { stroke: #495057; stroke-width: 2; stroke-dasharray: 10 10; }
    </style>
  </defs>

  <text x="720" y="58" text-anchor="middle" class="title">Compiler-native facts cross a process boundary</text>
  <text x="36" y="151" class="lane">WEAVE CORE</text>
  <text x="36" y="430" class="lane">ADAPTER PROCESS</text>
  <line x1="36" y1="386" x2="1404" y2="386" class="divider"/>

  <rect x="86" y="194" width="252" height="132" class="box" stroke="#4dabf7"/>
  <text x="212" y="239" text-anchor="middle" class="label">1. Negotiate</text>
  <text x="212" y="273" text-anchor="middle" class="small">protocol · capabilities</text>
  <text x="212" y="301" text-anchor="middle" class="tiny">provider and runtime identity</text>

  <rect x="432" y="194" width="252" height="132" class="box" stroke="#4dabf7"/>
  <text x="558" y="239" text-anchor="middle" class="label">2. Bound request</text>
  <text x="558" y="273" text-anchor="middle" class="small">repository · permissions</text>
  <text x="558" y="301" text-anchor="middle" class="tiny">deadline · negotiated limits</text>

  <rect x="778" y="194" width="252" height="132" class="box" stroke="#4dabf7"/>
  <text x="904" y="239" text-anchor="middle" class="label">4. Stage + validate</text>
  <text x="904" y="273" text-anchor="middle" class="small">frames · counts · graph</text>
  <text x="904" y="301" text-anchor="middle" class="tiny">reject incomplete runs</text>

  <rect x="1124" y="194" width="252" height="132" class="box" stroke="#51cf66"/>
  <text x="1250" y="239" text-anchor="middle" class="label">5. Publish</text>
  <text x="1250" y="273" text-anchor="middle" class="small">semantic units</text>
  <text x="1250" y="301" text-anchor="middle" class="tiny">complete units only</text>

  <rect x="230" y="476" width="326" height="170" class="box" stroke="#b197fc"/>
  <text x="393" y="522" text-anchor="middle" class="label">Compiler-native runtime</text>
  <text x="393" y="558" text-anchor="middle" class="small">Roslyn · FCS · CPython</text>
  <text x="393" y="588" text-anchor="middle" class="small">build and semantic units</text>
  <text x="393" y="618" text-anchor="middle" class="tiny">never writes the graph database</text>

  <rect x="720" y="476" width="490" height="170" class="box" stroke="#b197fc"/>
  <text x="965" y="522" text-anchor="middle" class="label">3. Complete framed response</text>
  <text x="965" y="558" text-anchor="middle" class="small">run.begin · unit.begin · facts</text>
  <text x="965" y="588" text-anchor="middle" class="small">unit.end · run.end</text>
  <text x="965" y="618" text-anchor="middle" class="tiny">protocol on stdout · diagnostics on stderr</text>

  <path d="M212 326 V444 C212 462 230 476 249 476" class="line-purple"/>
  <path d="M338 260 H432" class="line-blue"/>
  <path d="M558 326 V432 C558 458 533 476 509 476" class="line-purple"/>
  <path d="M556 561 H720" class="line-purple"/>
  <path d="M965 476 V351 C965 337 946 326 928 326" class="line-blue"/>
  <path d="M1030 260 H1124" class="line-blue"/>

  <rect x="230" y="700" width="980" height="48" fill="#242021" stroke="#f06595" stroke-width="3" rx="14"/>
  <text x="720" y="731" text-anchor="middle" class="small">Any protocol, process, limit, ownership, or graph failure leaves prior facts untouched</text>
</svg>
