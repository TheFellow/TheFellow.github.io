<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Weave fresh query lifecycle</title>
  <desc id="desc">A query inspects Git state and a complete manifest. Current state proceeds to a bounded graph query. Stale state refreshes semantic providers, validates and replaces units, then publishes the manifest before the same graph query runs.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4dabf7"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f06595"/>
    </marker>
    <style>
      .title { fill: #f1f3f5; font: 700 36px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #f1f3f5; font: 600 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #ced4da; font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tiny { fill: #adb5bd; font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .box { fill: #242021; stroke-width: 4; rx: 18; }
      .line-blue { fill: none; stroke: #4dabf7; stroke-width: 4; marker-end: url(#arrow-blue); }
      .line-pink { fill: none; stroke: #f06595; stroke-width: 4; marker-end: url(#arrow-pink); }
    </style>
  </defs>

  <text x="720" y="58" text-anchor="middle" class="title">A query proves freshness before it reads</text>

  <rect x="42" y="122" width="230" height="118" class="box" stroke="#4dabf7"/>
  <text x="157" y="169" text-anchor="middle" class="label">weave query</text>
  <text x="157" y="204" text-anchor="middle" class="small">explore · context · impact</text>

  <rect x="346" y="98" width="310" height="166" class="box" stroke="#4dabf7"/>
  <text x="501" y="145" text-anchor="middle" class="label">Inspect current identity</text>
  <text x="501" y="180" text-anchor="middle" class="small">commit · tree · branch</text>
  <text x="501" y="209" text-anchor="middle" class="small">dirty overlay · worktree</text>
  <text x="501" y="238" text-anchor="middle" class="small">provider versions</text>

  <rect x="748" y="98" width="286" height="166" class="box" stroke="#845ef7"/>
  <text x="891" y="145" text-anchor="middle" class="label">Compare manifest</text>
  <text x="891" y="180" text-anchor="middle" class="small">complete inventory</text>
  <text x="891" y="209" text-anchor="middle" class="small">unit fingerprints</text>
  <text x="891" y="238" text-anchor="middle" class="small">graph exists</text>

  <rect x="1132" y="122" width="266" height="118" class="box" stroke="#51cf66"/>
  <text x="1265" y="169" text-anchor="middle" class="label">Bounded query</text>
  <text x="1265" y="204" text-anchor="middle" class="small">deterministic evidence</text>

  <path d="M272 181 H346" class="line-blue"/>
  <path d="M656 181 H748" class="line-blue"/>
  <path d="M1034 181 H1132" class="line-blue"/>
  <text x="1084" y="160" text-anchor="middle" class="tiny">current</text>

  <path d="M891 264 V346" class="line-pink"/>
  <text x="916" y="315" class="tiny">stale</text>

  <rect x="128" y="360" width="322" height="166" class="box" stroke="#f06595"/>
  <text x="289" y="405" text-anchor="middle" class="label">Refresh providers</text>
  <text x="289" y="440" text-anchor="middle" class="small">Workspace · Go · .NET · Python</text>
  <text x="289" y="469" text-anchor="middle" class="small">Rust · C++ · TypeScript · bridges</text>
  <text x="289" y="498" text-anchor="middle" class="tiny">disjoint provider-owned inventories</text>

  <rect x="559" y="360" width="322" height="166" class="box" stroke="#f06595"/>
  <text x="720" y="405" text-anchor="middle" class="label">Validate and replace</text>
  <text x="720" y="440" text-anchor="middle" class="small">validate complete provider units</text>
  <text x="720" y="469" text-anchor="middle" class="small">project retained navigation facts</text>
  <text x="720" y="498" text-anchor="middle" class="tiny">compact before publication</text>

  <rect x="990" y="360" width="322" height="166" class="box" stroke="#f06595"/>
  <text x="1151" y="405" text-anchor="middle" class="label">Publish manifest</text>
  <text x="1151" y="440" text-anchor="middle" class="small">only after graph success</text>
  <text x="1151" y="469" text-anchor="middle" class="small">atomic file replacement</text>
  <text x="1151" y="498" text-anchor="middle" class="tiny">interruption remains stale</text>

  <path d="M891 346 C760 315 510 315 289 360" class="line-pink"/>
  <path d="M450 443 H559" class="line-pink"/>
  <path d="M881 443 H990" class="line-pink"/>
  <path d="M1151 360 C1210 314 1265 295 1265 240" class="line-blue"/>

  <rect x="196" y="622" width="1048" height="82" fill="#242021" stroke="#51cf66" stroke-width="3" rx="16"/>
  <text x="720" y="656" text-anchor="middle" class="small">stdout: requested result or weave.query/v2</text>
  <text x="720" y="685" text-anchor="middle" class="small">stderr: refresh notices and diagnostics</text>
  <path d="M1265 240 V575 C1265 600 1238 620 1212 622" class="line-blue"/>
</svg>
