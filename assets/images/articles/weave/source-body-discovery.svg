<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Discover source bodies with compact anchors and bounded ripgrep</title>
  <desc id="desc">A research phrase becomes a small fixed-string term set. The navigation index supplies semantic anchors while one bounded ignore-aware ripgrep pass supplies current path, line, column, and preview hits. Results are diversified and bounded before exact context is opened.</desc>
  <defs>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#fab005"/></marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#22b8cf"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#51cf66"/></marker>
    <style>
      .bg{fill:#151217}.box{fill:#242021;stroke-width:4;rx:16}.title{fill:#f8f9fa;font:700 34px ui-monospace,SFMono-Regular,Menlo,monospace}.label{fill:#f8f9fa;font:700 23px ui-monospace,SFMono-Regular,Menlo,monospace}.small{fill:#d8dee9;font:18px ui-monospace,SFMono-Regular,Menlo,monospace}.tiny{fill:#adb5bd;font:16px ui-monospace,SFMono-Regular,Menlo,monospace}.lane{fill:#ced4da;font:700 17px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px}.yellow{stroke:#fab005;stroke-width:5;fill:none;marker-end:url(#arrow-yellow)}.cyan{stroke:#22b8cf;stroke-width:5;fill:none;marker-end:url(#arrow-cyan)}.green{stroke:#51cf66;stroke-width:5;fill:none;marker-end:url(#arrow-green)}
    </style>
  </defs>
  <rect width="1440" height="900" class="bg"/>
  <text x="720" y="66" text-anchor="middle" class="title">Keep anchors indexed, search bodies in current source</text>

  <text x="44" y="126" class="lane">CURRENT WORKTREE</text>
  <rect x="44" y="150" width="418" height="214" class="box" stroke="#fab005"/>
  <text x="253" y="198" text-anchor="middle" class="label">Navigation anchors</text>
  <text x="253" y="238" text-anchor="middle" class="small">documents · sections</text>
  <text x="253" y="270" text-anchor="middle" class="small">packages · types · callables</text>
  <text x="253" y="302" text-anchor="middle" class="small">stable names + ranges</text>
  <text x="253" y="340" text-anchor="middle" class="tiny">compact semantic lookup</text>

  <rect x="44" y="410" width="418" height="214" class="box" stroke="#ff922b"/>
  <text x="253" y="458" text-anchor="middle" class="label">Git-visible source</text>
  <text x="253" y="498" text-anchor="middle" class="small">ignore-aware · current bytes</text>
  <text x="253" y="530" text-anchor="middle" class="small">≤ 1 MiB per searched file</text>
  <text x="253" y="562" text-anchor="middle" class="small">vendor + node_modules excluded</text>
  <text x="253" y="600" text-anchor="middle" class="tiny">no body vocabulary persisted</text>

  <path d="M462 257 H530" class="yellow"/>
  <path d="M462 517 H496 V315 H530" class="yellow"/>

  <text x="530" y="126" class="lane">BOUNDED SOURCE SEARCH</text>
  <rect x="530" y="150" width="430" height="474" class="box" stroke="#22b8cf"/>
  <text x="745" y="198" text-anchor="middle" class="label">Useful fixed-string terms</text>
  <text x="745" y="244" text-anchor="middle" class="small">normalize · remove stop words</text>
  <rect x="574" y="278" width="342" height="116" class="box" stroke="#fab005"/>
  <text x="745" y="320" text-anchor="middle" class="small">terms ≥ 4 characters</text>
  <text x="745" y="352" text-anchor="middle" class="small">at most 8 terms</text>
  <text x="745" y="382" text-anchor="middle" class="tiny">one fixed-string rg invocation</text>
  <path d="M745 394 V440" class="cyan"/>
  <rect x="574" y="440" width="342" height="126" class="box" stroke="#4dabf7"/>
  <text x="745" y="484" text-anchor="middle" class="label">Rank + diversify lines</text>
  <text x="745" y="522" text-anchor="middle" class="small">path · line · column · preview</text>
  <text x="745" y="552" text-anchor="middle" class="tiny">strongest files first</text>
  <text x="745" y="604" text-anchor="middle" class="tiny">1 MiB subprocess-output ceiling</text>

  <path d="M960 387 H1028" class="cyan"/>

  <text x="1028" y="126" class="lane">BOUNDED RETRIEVAL</text>
  <rect x="1028" y="150" width="368" height="214" class="box" stroke="#b197fc"/>
  <text x="1212" y="198" text-anchor="middle" class="label">weave explore</text>
  <text x="1212" y="238" text-anchor="middle" class="small">semantic anchors + source hits</text>
  <text x="1212" y="270" text-anchor="middle" class="small">item limit + 12 KiB ceiling</text>
  <text x="1212" y="302" text-anchor="middle" class="small">compact choice points</text>
  <text x="1212" y="340" text-anchor="middle" class="tiny">exact next command on anchors</text>

  <path d="M1212 364 V410" class="green"/>
  <rect x="1028" y="410" width="368" height="214" class="box" stroke="#51cf66"/>
  <text x="1212" y="458" text-anchor="middle" class="label">Selected current context</text>
  <text x="1212" y="498" text-anchor="middle" class="small">reopen Git-visible path</text>
  <text x="1212" y="530" text-anchor="middle" class="small">verify identity + hash + UTF-8</text>
  <text x="1212" y="562" text-anchor="middle" class="small">open one exact declaration</text>
  <text x="1212" y="600" text-anchor="middle" class="tiny">no stored body terms or source bytes</text>

  <text x="44" y="700" class="lane">BOUNDARIES THAT STAY TRUE</text>
  <rect x="44" y="726" width="1352" height="112" class="box" stroke="#495057"/>
  <text x="720" y="772" text-anchor="middle" class="small">no body postings · no embeddings · no arbitrary binary search · no semantic upgrade</text>
  <text x="720" y="812" text-anchor="middle" class="small">semantic anchors + bounded ripgrep + current-source authority</text>
</svg>
