<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Explicit sessions and an ephemeral broker reuse local Weave query state</title>
  <desc id="desc">An agent may own a foreground NDJSON session, while ordinary bounded local reads can use an on-demand per-worktree Unix-socket broker. Both normalize the same query invocations and reuse the resident application path. Freshness remains authoritative, mutations drain the broker, one-shot fallback remains available, and the broker exits after one idle minute.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#20c997"/></marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#22b8cf"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff922b"/></marker>
    <style>
      .bg{fill:#151217}.box{fill:#242021;stroke-width:4;rx:16}.title{fill:#f8f9fa;font:700 34px ui-monospace,SFMono-Regular,Menlo,monospace}.label{fill:#f8f9fa;font:700 23px ui-monospace,SFMono-Regular,Menlo,monospace}.small{fill:#d8dee9;font:18px ui-monospace,SFMono-Regular,Menlo,monospace}.tiny{fill:#adb5bd;font:16px ui-monospace,SFMono-Regular,Menlo,monospace}.lane{fill:#ced4da;font:700 17px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px}.green{stroke:#20c997;stroke-width:5;fill:none;marker-end:url(#arrow-green)}.cyan{stroke:#22b8cf;stroke-width:5;fill:none;marker-end:url(#arrow-cyan)}.orange{stroke:#ff922b;stroke-width:5;fill:none;marker-end:url(#arrow-orange)}
    </style>
  </defs>
  <rect width="1440" height="900" class="bg"/>
  <text x="720" y="66" text-anchor="middle" class="title">Reuse local reads, keep freshness authoritative</text>

  <text x="44" y="126" class="lane">TWO CLIENT SHAPES</text>
  <rect x="44" y="150" width="300" height="214" class="box" stroke="#20c997"/>
  <text x="194" y="198" text-anchor="middle" class="label">Session or CLI</text>
  <text x="194" y="238" text-anchor="middle" class="small">explicit NDJSON child</text>
  <text x="194" y="270" text-anchor="middle" class="small">ordinary bounded command</text>
  <text x="194" y="302" text-anchor="middle" class="small">same invocation shape</text>
  <text x="194" y="340" text-anchor="middle" class="tiny">WEAVE_NO_BROKER=1 opts out</text>

  <path d="M344 220 H424" class="green"/>
  <path d="M424 300 H344" class="cyan"/>
  <text x="384" y="206" text-anchor="middle" class="tiny">request</text>
  <text x="384" y="326" text-anchor="middle" class="tiny">frame</text>

  <text x="424" y="126" class="lane">REUSED APPLICATION PATH</text>
  <rect x="424" y="150" width="548" height="474" class="box" stroke="#20c997"/>
  <text x="698" y="198" text-anchor="middle" class="label">Session or local broker</text>
  <text x="698" y="232" text-anchor="middle" class="tiny">query-session/v1 · local-broker/v1</text>
  <rect x="468" y="268" width="460" height="116" class="box" stroke="#4dabf7"/>
  <text x="698" y="312" text-anchor="middle" class="label">Serialized application queries</text>
  <text x="698" y="350" text-anchor="middle" class="small">compact explore · selected context</text>
  <path d="M698 384 V430" class="green"/>
  <rect x="468" y="430" width="460" height="126" class="box" stroke="#20c997"/>
  <text x="698" y="474" text-anchor="middle" class="label">Resident read service</text>
  <text x="698" y="512" text-anchor="middle" class="small">schema + dictionaries stay warm</text>
  <text x="698" y="542" text-anchor="middle" class="tiny">shared reads · exclusive writers</text>
  <text x="698" y="600" text-anchor="middle" class="tiny">cold first request · warm following requests</text>

  <text x="1020" y="126" class="lane">FRESHNESS LOOP</text>
  <rect x="1020" y="150" width="376" height="214" class="box" stroke="#22b8cf"/>
  <text x="1208" y="198" text-anchor="middle" class="label">On-demand broker</text>
  <text x="1208" y="238" text-anchor="middle" class="small">private per-worktree endpoint</text>
  <text x="1208" y="270" text-anchor="middle" class="small">startup lock · exact identity</text>
  <text x="1208" y="302" text-anchor="middle" class="small">one idle minute → exit</text>
  <text x="1208" y="340" text-anchor="middle" class="tiny">never installed or supervised</text>

  <path d="M1020 286 H972" class="cyan"/>
  <path d="M928 493 H980 V410 H1020" class="orange"/>

  <rect x="1020" y="410" width="376" height="214" class="box" stroke="#ff922b"/>
  <text x="1208" y="458" text-anchor="middle" class="label">Authority boundary</text>
  <text x="1208" y="498" text-anchor="middle" class="small">refresh through ordinary pipeline</text>
  <text x="1208" y="530" text-anchor="middle" class="small">drain before write or maintenance</text>
  <text x="1208" y="562" text-anchor="middle" class="small">safe one-shot fallback</text>
  <text x="1208" y="600" text-anchor="middle" class="tiny">no second publication path</text>

  <text x="44" y="700" class="lane">COMMAND BOUNDARY</text>
  <rect x="44" y="726" width="1352" height="112" class="box" stroke="#495057"/>
  <text x="720" y="772" text-anchor="middle" class="small">reused reads: symbols · explore · context · definition · dependencies · path · impact · graph</text>
  <text x="720" y="812" text-anchor="middle" class="small">drain first: index · verify · GC · export · mutation · adapters · catalog · links · watch</text>
</svg>
